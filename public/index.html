<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habla Conmigo — Your Patient Language Tutor</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Habla Conmigo</h1>
      <p class="tagline">Your patient <span id="lang-name">language</span> practice partner — powered by an open-weight model running on your own laptop.</p>
      <div class="status-row">
        <span id="model-status" class="chip">model: checking…</span>
        <span id="voice-status" class="chip">voice: checking…</span>
      </div>
    </header>

    <section class="chat" id="chat" aria-live="polite">
      <div class="bubble tutor" data-turn="system">
        <div class="bubble__who">Tutor</div>
        <div class="bubble__text">¡Hola! I'm your practice partner. Tap the mic and say something — anything. Let's talk.</div>
      </div>
    </section>

    <section class="composer">
      <button id="mic-btn" class="mic-btn" aria-label="Record your voice">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/>
        </svg>
      </button>
      <input id="text-input" class="text-input" type="text" placeholder="Or type instead…" autocomplete="off" />
      <button id="send-btn" class="send-btn" aria-label="Send message">Send</button>
    </section>

    <div id="recording-indicator" class="recording hidden">
      <span class="recording__dot"></span> Listening… speak in the language you're learning
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
